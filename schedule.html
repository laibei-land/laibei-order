<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>來杯排班交接</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700&display=swap">
<style>
/* 來杯排班＆交接（2026-11-20）：家人輪流顧店的排班、交接紀錄、每日開關店檢查。
   只有老闆娘和成員能用；資料存在 Firebase 的 shifts／handovers／dailyChecks／shiftConfig */
:root{
  --bg:#FBF8F1; --surface:#FFFFFF; --ink:#2B2723; --muted:#7A7068; --line:#E8E1D6;
  --sea:#2F7A86; --sea-soft:#E3F0F1; --sand:#FAF2CB; --pink:#D9667F;
  --good:#3E8A5B; --bad:#C2543F;
  --c0:#DCEFF1; --c0i:#1F5E68; --c1:#F8E1E6; --c1i:#8A3348; --c2:#E5F1E2; --c2i:#2F6A3A;
  --c3:#F6EBCB; --c3i:#7A5A12; --c4:#E8E3F4; --c4i:#4E3F80; --c5:#EFE9E1; --c5i:#5A5047;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --num:"Outfit","Noto Sans TC",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root{
  --bg:#171513; --surface:#211E1B; --ink:#F0EBE3; --muted:#ADA398; --line:#38332D;
  --sea:#6CC3CF; --sea-soft:#1F3236; --sand:#3A3624; --pink:#F08CA2; --good:#6CC48C; --bad:#EE8A75;
  --c0:#1F3A3E; --c0i:#9ED9E1; --c1:#3E2329; --c1i:#F4AFC0; --c2:#22362A; --c2i:#A6DDB0;
  --c3:#3A3220; --c3i:#EDCD7E; --c4:#2D2840; --c4i:#C4B8F0; --c5:#302B26; --c5i:#CFC5BA; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 80px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
header small{display:block;color:var(--sea);font-weight:700;letter-spacing:.12em;font-size:12px}
header h1{margin:2px 0 4px;font-size:26px;font-weight:900}
header p{margin:0 0 14px;color:var(--muted)}
.who{font-size:12px;color:var(--muted);text-align:right;margin:-6px 0 10px}
.who button{border:0;background:none;color:var(--sea);text-decoration:underline;padding:0 4px;font-size:12px}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;background:var(--sea);color:var(--surface)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.danger.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.msg{background:var(--sand);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.login{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px 16px;text-align:center;display:grid;gap:12px;justify-items:center}
.login p{margin:0;color:var(--muted)}
.now{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sea);border-radius:14px;padding:14px 16px;margin-bottom:14px;display:grid;gap:4px}
.now .big{font-size:19px;font-weight:900}
.now .sub{color:var(--muted);font-size:14px}
.now .todo{margin-top:6px;background:var(--sand);border-radius:10px;padding:8px 10px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sea-soft);border-radius:12px;padding:4px;margin-bottom:14px}
.tabs a{text-align:center;padding:9px 4px;border-radius:9px;font-weight:700;color:var(--sea);text-decoration:none;font-size:15px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .grow{flex:1;min-width:0;font-weight:700;font-size:17px}
.bar .hint{flex:1;min-width:0;color:var(--muted);font-size:13px}
h2{font-size:16px;margin:20px 0 8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .h{text-align:center;font-size:12px;color:var(--muted);padding:2px 0}
.day{min-height:62px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.day.blank{background:none;border:0}
.day.today{border:2px solid var(--sea)}
.day .d{font-family:var(--num);font-size:12px;color:var(--muted);line-height:1.2}
.day.today .d{color:var(--sea);font-weight:700}
.tag{display:block;border-radius:5px;padding:1px 3px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
.off{font-size:11px;color:var(--muted)}
.c0{background:var(--c0);color:var(--c0i)}.c1{background:var(--c1);color:var(--c1i)}.c2{background:var(--c2);color:var(--c2i)}
.c3{background:var(--c3);color:var(--c3i)}.c4{background:var(--c4);color:var(--c4i)}.c5{background:var(--c5);color:var(--c5i)}
.list{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.row .pill{flex:none;border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.row .info{flex:1;min-width:0}
.row .info b{display:block}
.row .info span{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row.past{opacity:.7}
.empty{text-align:center;color:var(--muted);padding:22px 10px;background:var(--surface);border:1px dashed var(--line);border-radius:12px}
details summary{cursor:pointer;color:var(--muted);font-size:14px;margin:14px 0 8px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.hcard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hcard .top b{font-size:16px}
.hcard .top .sp{flex:1}
.hcard .line{font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.hcard .line .k{color:var(--muted);font-size:12px;display:block;white-space:normal}
.hcard .by{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button,.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:14px}
.chip{background:var(--sand);border-color:transparent}
.chips button[aria-pressed="true"]{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.chips.pick button[aria-pressed="true"]{background:var(--sea);border-color:var(--sea)}
.todo-i{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.todo-i input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--good)}
.todo-i.done span{text-decoration:line-through;color:var(--muted)}
.ckcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.ckcard .t{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ckcard .t b{font-size:17px;flex:1}
.prog{font-family:var(--num);font-weight:700;color:var(--muted)}
.prog.full{color:var(--good)}
.ck{display:flex;gap:10px;align-items:center;padding:9px 4px;border-top:1px solid var(--line);cursor:pointer;font-size:15px}
.ck input{width:22px;height:22px;flex:none;accent-color:var(--good)}
.ck.done span{color:var(--muted);text-decoration:line-through}
.ckby{font-size:12px;color:var(--muted);margin-top:6px}
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.daynav input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(20,16,12,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:760px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px}
.panel h3{margin:0;font-size:20px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;color:var(--ink);font-size:15px;min-width:0;width:100%}
label.f textarea{min-height:76px;resize:vertical}
.fl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:4px}
.note{background:var(--sand);border-radius:10px;padding:8px 10px;font-size:13px}
.warn{color:var(--bad);font-size:13px}
.foot{display:flex;gap:8px;flex-wrap:wrap}
.foot .sp{flex:1}
.setlink{margin-top:28px;text-align:center;font-size:14px}
.setlink a,.links a{color:var(--sea);font-weight:700}
.links{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:14px}
@media (max-width:420px){.day{min-height:54px}.tag{font-size:10px;padding:0 2px}.row2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <small>來杯！・LAI BEI</small>
    <h1>排班＆交接</h1>
    <p>家人輪流顧店：誰顧哪幾天、交接時留給下一位的話、每天開店關店打勾。</p>
  </header>
  <div class="msg" id="msg" hidden></div>

  <div id="login" class="login">
    <b style="font-size:18px">請先登入</b>
    <p id="login-msg">這是店裡的資料，只有老闆娘同意過的家人能看。</p>
    <button class="btn" id="signin" style="max-width:280px;width:100%">用 Google 登入</button>
  </div>

  <div id="app" hidden>
    <div class="who" id="who"></div>
    <div class="now" id="now"><div class="sub">讀取中…</div></div>
    <nav class="tabs">
      <a href="#shifts" id="t-shifts">📅 排班</a>
      <a href="#handover" id="t-handover">📝 交接</a>
      <a href="#check" id="t-check">✅ 每日檢查</a>
    </nav>

    <main id="v-shifts">
      <div class="bar">
        <button class="btn ghost small" id="m-prev" aria-label="上個月">‹</button>
        <span class="grow num" id="m-title" style="text-align:center"></span>
        <button class="btn ghost small" id="m-next" aria-label="下個月">›</button>
      </div>
      <div class="cal" id="cal"></div>
      <div class="bar" style="margin-top:14px"><span class="hint">點日曆上的日子也可以排班。10～4 月週一公休。</span><button class="btn" id="new-s">＋ 排一段</button></div>
      <div class="list" id="slist"></div>
      <details id="spast-box" hidden><summary>過去的排班</summary><div class="list" id="spast"></div></details>
    </main>

    <main id="v-handover" hidden>
      <div class="bar"><span class="hint">換人顧店時寫一份：錢、快沒貨的東西、發生的事、留給下一位的待辦。</span><button class="btn" id="new-h">＋ 寫交接</button></div>
      <div class="list" id="hlist"></div>
    </main>

    <main id="v-check" hidden>
      <div class="daynav">
        <button class="btn ghost small" id="d-prev" aria-label="前一天">‹</button>
        <input type="date" id="d-pick" aria-label="日期">
        <button class="btn ghost small" id="d-next" aria-label="後一天">›</button>
      </div>
      <div id="ckbox"></div>
    </main>

    <div class="setlink"><a href="#" id="open-set">⚙️ 設定：顧店的人、檢查清單、常叫貨的東西</a></div>
    <div class="links"><a href="./#kitchen">👩‍🍳 後台</a><a href="cost.html">🧮 成本計算機</a><a href="team.html">👥 成員管理</a></div>
  </div>
</div>
<div class="sheet" id="sheet" hidden><div class="panel" id="panel" role="dialog" aria-modal="true"></div></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
/* Google 不讓 LINE／FB／IG 裡面的瀏覽器登入：LINE 自動跳到手機瀏覽器，其他的顯示教學 */
const UA=navigator.userAgent;
const IN_APP=/Line\/|FBAN|FBAV|FB_IAB|Instagram|MicroMessenger|Threads/i.test(UA);
if(/Line\//i.test(UA)&&location.search.indexOf("openExternalBrowser")<0){location.replace(location.pathname+"?openExternalBrowser=1"+location.hash)}
const loginError=e=>{const c=(e&&e.code)||"";
  if(c==="auth/popup-blocked")return "登入視窗被擋住了。請允許這個網站跳出視窗，或改用 Safari／Chrome 打開。";
  if(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")return "登入視窗被關掉了，請再按一次「用 Google 登入」。";
  if(c==="auth/network-request-failed")return "網路不穩，請確認有網路再試一次。";
  if(IN_APP||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported")return "這裡沒辦法用 Google 登入。請按右上角「⋯」選「用瀏覽器開啟」，或把網址複製到 Safari／Chrome 打開。";
  return "登入沒有成功（"+(c||"請再試一次")+"）。請改用 Safari／Chrome 打開這個網址再試一次。"};
if(IN_APP)document.getElementById("login-msg").textContent="⚠️ 你現在是在 App 裡面（LINE、FB、IG）打開的，Google 不讓這裡登入。請按右上角「⋯」選「用瀏覽器開啟」，或把網址複製到 Safari／Chrome 打開。";
const SDK="https://www.gstatic.com/firebasejs/10.12.2/";
const [app,fs,au]=await Promise.all([import(SDK+"firebase-app.js"),import(SDK+"firebase-firestore.js"),import(SDK+"firebase-auth.js")]);
const fapp=app.initializeApp(firebaseConfig);const fdb=fs.getFirestore(fapp);const auth=au.getAuth(fapp);

const SH="shifts",HO="handovers",CK="dailyChecks",CF="shiftConfig";
/* 預設清單（老闆娘可以在「⚙️ 設定」改） */
const DEF={
  people:["Jenny","爸爸"],
  openList:["開燈、開冷氣","確認冰箱溫度","煮茶（紅茶、綠茶、烏龍）","備冰塊","補杯子、封膜、吸管","錢櫃放零錢","打開點餐後台"],
  closeList:["剩下的茶倒掉、茶桶洗乾淨","雪克杯、器具洗好","擦檯面、桌子","倒垃圾、做回收","冰箱門關好","錢櫃現金點好","關封口機、熱水機","關燈、關冷氣","鎖門"],
  lowItems:["紅茶葉","綠茶葉","烏龍茶葉","鮮奶","奶精","糖","黑糖","冰塊","珍珠","椰果","寒天","檸檬","M 杯","L 杯","封膜","吸管","袋子","零錢"]
};
let cfg={...DEF},shifts={},hands={},checks={},unsubs=[],me={name:"",email:""};
let month=new Date();month.setDate(1);
const $=s=>document.querySelector(s);
function el(t,a={},...k){const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==="class")e.className=v;else if(x.startsWith("on"))e.addEventListener(x.slice(2),v);else if(v!==false&&v!=null)e.setAttribute(x,v===true?"":v)}k.flat().forEach(c=>{if(c!=null&&c!=="")e.append(c)});return e}
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const toDate=s=>{const p=String(s).split("-").map(Number);return new Date(p[0],p[1]-1,p[2])};
const addDays=(s,n)=>{const d=toDate(s);d.setDate(d.getDate()+n);return ymd(d)};
const WK="日一二三四五六";
const md=s=>{const d=toDate(s);return (d.getMonth()+1)+"/"+d.getDate()};
const mdw=s=>md(s)+"（"+WK[toDate(s).getDay()]+"）";
const diffDays=(a,b)=>Math.round((toDate(b)-toDate(a))/864e5);
const isOff=s=>{const d=toDate(s);const m=d.getMonth()+1;return d.getDay()===1&&(m>=10||m<=4)};
const money=n=>"$"+Math.round(Number(n)||0).toLocaleString("en-US");
const colorOf=name=>{const i=cfg.people.indexOf(name);return "c"+(i<0?5:i%6)};
const sortedShifts=()=>Object.entries(shifts).map(([id,s])=>({id,...s})).filter(s=>s.start&&s.end).sort((a,b)=>a.start.localeCompare(b.start)||a.who.localeCompare(b.who));
const whoOn=d=>sortedShifts().filter(x=>x.start<=d&&x.end>=d);
const nextAfter=d=>sortedShifts().find(x=>x.start>d);
const sortedHands=()=>Object.entries(hands).map(([id,h])=>({id,...h})).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.at||0)-(a.at||0));
const sayMsg=t=>{const m=$("#msg");m.textContent=t;m.hidden=!t};
const ref=(c,id)=>fs.doc(fdb,c,id);
const save=(c,id,d,merge)=>fs.setDoc(ref(c,id),d,merge?{merge:true}:{}).catch(e=>{console.error(e);sayMsg("剛剛的修改沒有存到，請檢查網路再試一次。");throw e});
const remove=(c,id)=>fs.deleteDoc(ref(c,id)).catch(()=>sayMsg("刪除沒有成功，請再試一次。"));
function twoStep(btn,label,sureLabel,fn){btn.onclick=()=>{if(btn.classList.contains("sure"))fn();else{btn.classList.add("sure");btn.textContent=sureLabel;setTimeout(()=>{btn.classList.remove("sure");btn.textContent=label},4000)}}}
const lines=t=>String(t||"").split("\n").map(x=>x.trim()).filter(Boolean);

/* ---------- 上面的「今天誰顧店」 ---------- */
function renderNow(){
  const t=today(),on=whoOn(t),nx=nextAfter(t),box=$("#now");box.replaceChildren();
  if(on.length){
    const s=on[0],left=diffDays(t,s.end);
    box.append(el("div",{class:"big"},"🏠 今天顧店：",on.map(x=>x.who).join("、")));
    box.append(el("div",{class:"sub"},md(s.start)+"～"+md(s.end)+"・"+(left===0?"今天是最後一天，記得寫交接 📝":"還有 "+left+" 天")+(isOff(t)?"・今天週一公休":"")));
  }else{
    box.append(el("div",{class:"big"},isOff(t)?"🏠 今天週一公休":"🏠 今天還沒排人"));
  }
  if(nx)box.append(el("div",{class:"sub"},"下一位："+nx.who+"，"+mdw(nx.start)+" 開始"));
  const last=sortedHands()[0];
  const open=last?(last.todos||[]).filter(x=>!x.done):[];
  if(open.length)box.append(el("div",{class:"todo"},"📌 "+(last.from||"")+" 留給你的待辦還有 "+open.length+" 件（看「📝 交接」）"));
}

/* ---------- 排班 ---------- */
function renderCal(){
  const y=month.getFullYear(),m=month.getMonth();
  $("#m-title").textContent=y+" 年 "+(m+1)+" 月";
  const cal=$("#cal");cal.replaceChildren(...[..."日一二三四五六"].map(w=>el("div",{class:"h"},w)));
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=today();
  for(let i=0;i<first;i++)cal.append(el("div",{class:"day blank"}));
  for(let d=1;d<=days;d++){
    const s=y+"-"+pad(m+1)+"-"+pad(d),on=whoOn(s);
    const cell=el("button",{class:"day"+(s===t?" today":""),"aria-label":(m+1)+"月"+d+"日 "+(on.map(x=>x.who).join("、")||"還沒排")},el("span",{class:"d"},String(d)));
    on.forEach(x=>cell.append(el("span",{class:"tag "+colorOf(x.who)},x.who)));
    if(isOff(s))cell.append(el("span",{class:"off"},"公休"));

async function ordersSales(fromDay,toDay){
